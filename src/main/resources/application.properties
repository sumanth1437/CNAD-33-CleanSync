spring.application.name=cleansync
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cleansync}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cleansync}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cleansync_dev_password}
spring.sql.init.mode=always
spring.datasource.hikari.initialization-fail-timeout=60000
