services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cleansync
      POSTGRES_USER: cleansync
      POSTGRES_PASSWORD: cleansync_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleansync -d cleansync"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/cleansync
      SPRING_DATASOURCE_USERNAME: cleansync
      SPRING_DATASOURCE_PASSWORD: cleansync_dev_password
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
