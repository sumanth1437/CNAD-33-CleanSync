apiVersion: v1
kind: Secret
metadata:
  name: cleansync-db-secret
type: Opaque
stringData:
  username: cleansync
  password: cleansync_dev_password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cleansync-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cleansync
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: cleansync
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cleansync-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cleansync-db-secret
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U cleansync -d cleansync"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleansync
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cleansync
  template:
    metadata:
      labels:
        app: cleansync
    spec:
      containers:
        - name: cleansync
          image: cleansync:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: cleansync-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cleansync-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cleansync-db-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: cleansync
spec:
  selector:
    app: cleansync
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort
